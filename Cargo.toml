[package]
name = "soc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The ssh configuration reader expands `Include` with the system's glob(3) and matches
# `Host` patterns with fnmatch(3), as OpenSSH does, instead of our own matcher. libc is
# maintained by the Rust project, has no dependencies of its own and declares the
# platform's structures, so no C layout is written by hand.
libc = "0.2.191"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
# The lockfiles reader parses package-lock.json. JSON is too easy to get subtly wrong by
# hand; serde_json is used through `Value` only, without derive.
serde_json = "1.0.154"
# Vulnerability matching orders versions by SemVer precedence, as OSV's SEMVER ranges are
# defined. Ordering versions is a silent mistake when written by hand; `semver` is dtolnay's,
# follows Cargo's choices, parses strictly and has no dependencies of its own.
semver = "1.0.28"
# Editors' settings, workspaces and dev container files are JSON with comments, a format
# someone else defines; Foundation reads it but drops the second of two equal keys, so it
# cannot say what the editor, which keeps the last, reads. jsonc-parser (dprint) keeps every
# property of an object in order in its tree, so equal keys stay visible. No feature is on,
# and with none it has no dependencies.
jsonc-parser = { version = "0.34.0", default-features = false }
