[package]
name = "immune"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
# The ssh configuration reader expands `Include` with the system's glob(3) and matches
# `Host` patterns with fnmatch(3), as OpenSSH does, instead of our own matcher. libc is
# maintained by the Rust project, has no dependencies of its own and declares the
# platform's structures, so no C layout is written by hand.
libc = "0.2.191"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
# The lockfiles reader parses package-lock.json. JSON is too easy to get subtly wrong by
# hand; serde_json is used through `Value` only, without derive.
serde_json = "1.0.154"
# Vulnerability matching orders versions by SemVer precedence, as OSV's SEMVER ranges are
# defined. Ordering versions is a silent mistake when written by hand; `semver` is dtolnay's,
# follows Cargo's choices, parses strictly and has no dependencies of its own.
semver = "1.0.28"
# Editors' settings, workspaces and dev container files are JSON with comments, a format
# someone else defines; Foundation reads it but drops the second of two equal keys, so it
# cannot say what the editor, which keeps the last, reads. jsonc-parser (dprint) keeps every
# property of an object in order in its tree, so equal keys stay visible. No feature is on,
# and with none it has no dependencies.
jsonc-parser = { version = "0.34.0", default-features = false }
# The event level evaluates SigmaHQ's published rules for macOS, unmodified, over each program
# start in memory. sigma-rust parses Sigma rules and evaluates them over key-value events:
# conditions, `1 of`/`all of`, and every modifier the shipped rules use. Of the two Rust
# evaluators it brings the fewer crates and parses all 75 shipped rules; without default
# features it leaves out JSON events, which the level does not need.
sigma-rust = { version = "0.7.0", default-features = false }
# The YAML parser sigma-rust itself uses, named so the rules' metadata and the shape of their
# detection can be read: sigma-rust parses both but keeps level, status and selections in
# private types. It brings no crate sigma-rust does not already bring.
serde_norway = "0.9.42"
# Before the evaluator is asked, one pass over each field of a program start finds which texts
# the rules need there, so that a rule that cannot match is not asked (`sigma.rs`). This is
# the multi-pattern search `regex`, which sigma-rust brings, is built on: BurntSushi's, with
# `memchr` as its one dependency, both already compiled in, so no crate is added.
aho-corasick = "1.1.5"
# The contract with a program that runs the core is a protobuf schema (`contract/`), and a
# command of the contract prints binary protobuf. Protobuf's wire format is someone else's, so
# it is not written by hand. prost is the protobuf runtime in general use in Rust (tokio-rs);
# the types it derives for are generated from the schema and committed (`src/contract.rs`).
# It links `bytes` into the program and runs `prost-derive` at build time, which brings
# `anyhow`, `itertools` and `either`. Its default features are `derive` and `std`. The version is
# the latest that had been published for at least two weeks.
prost = "0.14.4"
# The same messages as JSON with `--json`: serde's derives, put on the generated types by the
# generator, print them with serde_json. serde and serde_derive were already compiled in for
# sigma-rust; naming serde here adds no crate.
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# The test that keeps the committed types equal to what the schema gives generates them again
# (`tests/contract.rs`). prost-build is prost's generator. protox compiles the schema in Rust,
# so neither a build nor a test needs `protoc`. prost-types is named to read the compiled
# schema; protox and prost-build bring it anyway. None of the three is linked into the program.
prost-build = "0.14.4"
protox = "0.10.0"
prost-types = "0.14.4"
