// The events the collector writes and the published rules that match them, as both `Matches`
// (`matches.proto`) and a finding of a published rule (`findings.proto`) give them. Version 1 of
// the contract; how a message is read is in `common.proto`.
//
// Values that will be added. A reader meets values of `FileAction` and of a rule's `Level`, and
// cases of `Event`'s `body`, that it does not know: the core adds them within version 1. It
// treats one it does not know as something it cannot judge; a rule's level it does not know it
// reads as the highest, as `common.proto` says, and that level never decides whether a match
// raised a finding.

syntax = "proto3";

package immune.v1;

import "immune/v1/common.proto";

// A published rule, as the core ships it.
message Rule {
  // The rule's name: its set and its id, the same in every command. `sigma:<id>` for SigmaHQ's,
  // `elastic:<rule_id>` for Elastic's detection rules, `elastic-behaviour:<rule_id>` for
  // Elastic's behaviour rules. The store's name for it. A finding of a rule of a set that raises
  // findings carries this name.
  string name = 1;
  // Its path in the shipped set, under the set's folder, `rules/sigma/`, `rules/elastic/` or
  // `rules/elastic-behaviour/`, as the prefix of `name` says. It moves between upstream commits.
  string file = 2;
  // Its `id` and `title` as published, whole.
  string id_text = 3;
  string title_text = 4;
  // Its level; `LEVEL_NOT_STATED` for a rule whose set states none.
  Level level = 5;
  // ATT&CK techniques from its `attack.t…` tags, such as `T1027.001`.
  repeated string techniques_text = 6;
  // Its `author`, which a message made from a match keeps, as the Detection Rule License asks
  // for SigmaHQ's rules.
  optional string author_text = 7;
  // Its set: by its name for a machine, the prefix of `name` (`sigma`, `elastic` or
  // `elastic-behaviour`), and in words for a person, such as "SigmaHQ's rule set". Rules of
  // different sets can have the same title; these tell them apart. (`PublishedRuleMatched.source`
  // is another thing: where the set comes from.)
  string source = 8;
  string set = 9;
}

// An event as the collector's log holds it. The case of `body` that is set names its kind; a
// kind the reader does not know reads as no event.
message Event {
  oneof body {
    ProgramStart program_start = 1;
    FileEvent file_event = 2;
  }
}

// A process, as far as the collector keeps it. Only `executable_text` is always there; the rest
// is absent where the event does not give it. A pid is reused once the process ends; with its
// `pid_version` and when it started, `started_at`, it names one process. A collector installed
// before it kept these gives neither.
message Process {
  // Its program, the path of its executable. Whole.
  string executable_text = 1;
  // Its pid and its effective user id, from its audit token.
  optional int64 pid = 2;
  optional int64 user_id = 3;
  // Who signed its program: `signing_id`, `team_id` and `is_platform_binary`.
  optional string signing_id_text = 4;
  optional string team_id_text = 5;
  optional bool platform_binary = 6;
  // The pid's version, `pidversion` in its audit token, given as an object or as the eight
  // words of `audit_token_t`.
  optional int64 pid_version = 7;
  // When it started, from eslogger's `start_time`: seconds since the epoch and the nanoseconds
  // within that second. Absent when the log's time is not in the form eslogger writes.
  optional int64 started_at = 8;
  optional uint32 started_nanos = 9;
  // Its code-signing flags, eslogger's `codesigning_flags`, as the kernel's `CS_*` bits.
  optional uint32 codesigning_flags = 10;
}

// Who a process is, without its program: the pid and the pid's version of an audit token.
message Identity {
  optional int64 pid = 1;
  optional int64 pid_version = 2;
}

// A program started: an `exec` message from Apple's `eslogger`, as the collector keeps it. The
// environment is never kept.
message ProgramStart {
  // When it happened, from `time`: seconds since the epoch, and the nanoseconds within that
  // second. The log gives microseconds. Absent when the log's time is not in the form eslogger
  // writes.
  optional int64 happened_at = 1;
  optional uint32 happened_nanos = 2;
  // The process with the program started, `event.exec.target`: its executable, pid, user id,
  // signature, pid version, start time and code-signing flags.
  Process process = 3;
  // The same process before this `exec`, `process` in eslogger's message: its program,
  // `process.executable.path`, and its pid, pid version, start time and code-signing flags.
  // After a fork or `posix_spawn` that program is the parent's; after an `exec` without a fork
  // it is a wrapper that replaced itself, such as `nohup` or `env`. Absent when the log does not
  // give its program.
  Process instigator = 4;
  // `event.exec.target.ppid`.
  optional int64 parent_pid = 5;
  // The arguments, `event.exec.args`, the first included, each whole and in its own string.
  repeated string args_text = 6;
  // `event.exec.cwd.path`.
  optional string working_directory_text = 7;
  // The parent, `event.exec.target.parent_audit_token`. Absent when the log does not give its
  // pid.
  Identity parent = 8;
  // The script the program runs, `event.exec.script.path`, when the start is of an interpreter
  // that runs a script file.
  optional string script_text = 9;
}

// A file created or renamed: a `create` or `rename` message from `eslogger`, as the collector
// keeps it.
message FileEvent {
  // As in ProgramStart.
  optional int64 happened_at = 1;
  optional uint32 happened_nanos = 2;
  FileAction action = 3;
  // The file created, or where a renamed file went. Whole.
  string path_text = 4;
  // Where a renamed file was. Absent for a file created.
  optional string source_text = 5;
  // The process that did it, `process` in eslogger's message: its program,
  // `process.executable.path`, its pid, pid version and start time, and its `signing_id`.
  Process instigator = 6;
}

// What happened to a file, as `eslogger` names the event. `UNSPECIFIED`, or a value the reader
// does not know, is read as something it cannot judge.
enum FileAction {
  FILE_ACTION_UNSPECIFIED = 0;
  FILE_ACTION_CREATE = 1;
  FILE_ACTION_RENAME = 2;
}
