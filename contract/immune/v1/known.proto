// What Immune's core knows of one thing, from its store alone: the answer to `immune project`,
// `immune program` and `immune machine`. Version 1 of the contract between the core and a program
// that runs it. How a message is printed and read, and the conventions for text, references,
// times and changes, are in `common.proto`. `Known` cuts no text: a coverage reason in particular
// is given whole.

syntax = "proto3";

package immune.v1;

import "immune/v1/common.proto";

// What the store knows of one thing and of the things inside it. The same message answers for a
// project, a program or a machine; what differs is which thing is asked for.
message Known {
  // The version of this contract: 1. A reader that meets another number stops.
  uint32 format = 1;
  // What was asked for, as given on the command line. Whole.
  string asked_text = 2;
  // When the answer was made.
  int64 answered_at = 3;
  // Whether the store knows the thing at all.
  Presence presence = 4;
  // The thing asked for. Absent when the presence is `unknown`. A path names the project or the
  // program that holds it, the nearest one; an id names the thing with that id.
  // A machine the store knows under several ids linked by `same_as` is one thing: its parts,
  // facts, coverage and findings are those of every one of its ids, each fact under its own
  // `subject_text`.
  Entity thing = 5;
  // The things inside it: what is `part_of` or `located_on` it, and for a project the files whose
  // path lies in its folder. Only those with facts in force, and one level: in a project that is
  // every depth there is, and a machine's parts (its containers, packages, checkouts and watched
  // files) come without their own parts, which the question for that part gives, such as
  // `immune project` for a checkout.
  repeated Entity parts = 6;
  // The facts in force about the thing and its parts.
  repeated Fact facts = 7;
  // The latest reading of each reader, scope and kind that speaks for the thing: of the thing
  // and its parts, of what found them, of folders that were not looked into and hold it, and for
  // a project the readings of this Mac that read inside every project. For a thing the store
  // never heard of, every reading that looks for things of its kind.
  // Anything not full here was not read, or not read in full, and nothing is known of it since.
  // Some readings are made by rule rather than read from the store; they have no `observed_at`:
  // - a machine other than this Mac that the server check never visited: `servers`,
  //   `sweep visit`, completeness `none`;
  // - a machine the owner set aside as retired or not theirs: `servers`, `sweep of a machine set
  //   aside by the owner`, completeness `none`, the reason naming what the owner said and the day;
  // - a path that no reading looking for things of its kind looks at, answered `unknown`:
  //   `immune`, `places the readings that find projects look in` (or programs), completeness
  //   `none`.
  repeated Coverage coverage = 8;
  // The findings about the thing, about its parts whether what was read of them is in force or
  // retracted, and for a project about anything whose id lies in its folder; in every state.
  // `immune finding <id>` shows one.
  repeated FindingRef findings = 9;
  // The other ids the store knows the thing by, such as a machine's names linked by `same_as`.
  // A fact whose subject is one of these is about the thing; any other subject is a part.
  repeated Entity same_as = 10;
  // Which question was asked, so that an `unknown` answer says of what kind.
  Question question = 11;
  // When the core's latest run that finished ended. A reading older than it was not made again
  // in that run. Absent when no run has finished.
  optional int64 latest_run_at = 12;
  // The store this answer was read from, as in every answer (`common.proto`): random, made once
  // when the store was made. Absent for a store an older build made that no command has written
  // to since: until one does, nothing tells it apart from another store.
  optional string store_id = 13;
}

// The question a `Known` answers. `UNSPECIFIED` is read as a question this reader cannot answer.
enum Question {
  QUESTION_UNSPECIFIED = 0;
  // `immune project`.
  QUESTION_PROJECT = 1;
  // `immune program`.
  QUESTION_PROGRAM = 2;
  // `immune machine`.
  QUESTION_MACHINE = 3;
}

// Whether the store knows a thing. `UNSPECIFIED`, or a value the reader does not know, is read
// as not known.
enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  // The store has never heard of it. Which readings could have found it is in `coverage`.
  PRESENCE_UNKNOWN = 1;
  // The store holds facts in force about it.
  PRESENCE_HELD = 2;
  // It was known and no longer is: what was read of it is retracted.
  PRESENCE_GONE = 3;
}

// A thing as the store names it.
message Entity {
  // Its id: its type and natural key, such as `checkout:machine:<name>/<path>`. Whole.
  string id_text = 1;
  // Its type, such as `checkout`, `component` or `file`.
  string type = 2;
}

// A fact: the statements of one or more readers with the same subject, predicate and object.
message Fact {
  // An entity id, whole.
  string subject_text = 1;
  string predicate = 2;
  // An entity id or a literal, as the predicate takes; whole.
  string object_text = 3;
  // What the fact rests on, one per reader and reading that made it.
  repeated Assertion assertions = 4;
}

// One statement from one source.
message Assertion {
  string reader = 1;
  Basis basis = 2;
  // Where exactly it was read: a file and line, or a command and section. Whole.
  string source_ref_text = 3;
  // When the source was first read with this statement.
  int64 observed_at = 4;
  // The reading it belongs to, as in `Coverage`: an entity id, whole.
  string scope_text = 5;
  string kind = 6;
}

// How the source knows what it says, strongest first. `UNSPECIFIED`, or a value the reader does
// not know, is read as `mentioned`, the weakest.
enum Basis {
  BASIS_UNSPECIFIED = 0;
  // The thing itself.
  BASIS_OBSERVED = 1;
  // A description that tooling enforces, such as a lockfile.
  BASIS_DECLARED = 2;
  // Text. A fact that rests only on this never supports "does not affect me".
  BASIS_MENTIONED = 3;
}

// The latest reading of one kind by one reader in one scope.
message Coverage {
  string reader = 1;
  // What was looked for.
  string kind = 2;
  // Where it was looked for: an entity id, whole.
  string scope_text = 3;
  Completeness completeness = 4;
  // Why it was not full; on a full reading, an optional note such as why there was nothing to
  // read. Whole.
  optional string reason_text = 5;
  // Why it was not full, as a closed word; absent on a full reading.
  optional Cause cause = 6;
  // When it was read. Absent for a reading made by rule, which was never made.
  optional int64 observed_at = 7;
  // What this build has no reader for, found in this reading.
  repeated Lack lacks = 8;
}

// How much of what was looked for was read. `UNSPECIFIED`, or a value the reader does not know,
// is read as not full.
enum Completeness {
  COMPLETENESS_UNSPECIFIED = 0;
  COMPLETENESS_FULL = 1;
  COMPLETENESS_PARTIAL = 2;
  COMPLETENESS_NONE = 3;
}

// Why a reading was not full. `UNSPECIFIED`, or a value the reader does not know, is read as
// `failed`.
enum Cause {
  CAUSE_UNSPECIFIED = 0;
  // The reader tried and could not.
  CAUSE_FAILED = 1;
  // The thing is there and this build has no reader for it.
  CAUSE_NO_READER = 2;
  // The source does not hold it, or it was not given to the reader, such as a folder macOS asks
  // permission for.
  CAUSE_NOT_GIVEN = 3;
}

// Something this build has no reader for.
message Lack {
  // What it is, in the core's words.
  string what = 1;
  // Its name where the source gives one, such as a lockfile's.
  optional string name_text = 2;
}
