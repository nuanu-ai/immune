// The core as a login job of this user. The answer to `immune install` and `immune uninstall`.
// Version 1 of the contract between the core and a program that runs it. How a message is
// printed and read, and the conventions for text, references, times and changes, are in
// `common.proto`.
//
// `immune install` copies the binary it is run from to a place of its own and registers that
// copy with launchd as a login job; `immune uninstall` stops the job and removes it with the copy.
// Neither reads or changes the store, so this answer carries no `store_id`.

syntax = "proto3";

package immune.v1;

// What the command left.
message Service {
  // The numbers of `Failure`'s fields, so that a failure never reads as an answer.
  reserved 1000 to 1099;
  // The version of this contract: 1. A reader that meets another number stops.
  uint32 format = 1;
  int64 answered_at = 2;
  // The job's label in launchd: `ai.nuanu.immune.watch`.
  string label = 3;
  // The installed core the job runs, and the job's property list. Whole. After `immune
  // uninstall`, where they were.
  string program_path_text = 4;
  string plist_path_text = 5;
  // Whether the job, its property list and the installed core are in place: true after
  // `immune install`, false after `immune uninstall`.
  bool installed = 6;
  // Whether launchd has the job loaded, as `launchctl print` said after it was registered.
  // Never true unless that last question succeeded; always false after `immune uninstall`.
  bool loaded = 7;
  // Whether a job, its property list or an installed core was there before the command: an
  // update, or a removal that removed something. False for a first install and for an
  // uninstall where nothing was installed.
  bool replaced = 8;
}
