// The rule matches the core hands over: the answer to `immune matches`. Version 1 of the contract
// between the core and a program that runs it. How a message is printed and read, and the
// conventions for text, references, times and changes, are in `common.proto`; the rules and the
// events are in `event.proto`.
//
// The core evaluates published rules over the program starts and file events its collector
// writes to a log that lives a day: SigmaHQ's rules for macOS, and Elastic's detection rules and
// behaviour rules for macOS translated into Sigma. This answer gives every match of every rule,
// of every level and with none, each with the event it matched, in the order of the log. A match
// of a rule marked high or critical also raised a finding; the others, and those of a rule whose
// set states no level, are only counted in the store. Events that matched no rule are not given.
//
// The queue is the log itself, read again. The store keeps no event, and the caller keeps its
// own place: it passes `continue_after` back as `--after` to read on. The place is the core's own
// words and is opaque: a reader stores it and passes it back whole, and never parses or compares
// it. It holds what the core's own reading keeps for itself: for each log file, the file's
// identity and how far it was read. So a file that is replaced, a clock that was wrong, or a file
// deleted before it was read is noticed, and nothing is skipped without the answer saying so. An
// event may be given twice, after a file was replaced; it is never missed silently.
//
// When an answer is quiet. An answer with no matches says that nothing matched only when all of
// these hold:
// - `collector.state` is `running`;
// - the stretch shows nothing lost, unread or gone: every count in `stretch` other than
//   `program_starts`, `file_events` and `other` is 0, and `gone` is false;
// - `collector.file_events_collected` is true;
// - no rule the reader cares about is in `unevaluated`. A rule there `in_part` is evaluated, and
//   a match of it is a match; that it did not match says nothing of the alternatives that need
//   the fields in its `fields_text`.
// Otherwise the answer says what the core did not see, and the reader does not take it for calm.
//
// Values that will be added. A reader meets values of `Raised`, `CollectorState`,
// `UnevaluatedReason` and a rule's `Level`, and those `event.proto` names, that it does not know:
// the core adds them within version 1. It treats one it does not know as something it cannot
// judge; a rule's level it does not know it reads as the highest, as `common.proto` says, and
// that level never decides whether a match raised a finding: `raised` says that.

syntax = "proto3";

package immune.v1;

import "immune/v1/common.proto";
import "immune/v1/event.proto";
import "immune/v1/verdict.proto";

// The answer to `immune matches`.
message Matches {
  // The numbers of `Failure`'s fields, so that a failure never reads as an answer.
  reserved 1000 to 1099;
  // The version of this contract: 1. A reader that meets another number stops.
  uint32 format = 1;
  // When the answer was made.
  int64 answered_at = 2;
  // The place given with `--after`, as given. Absent when the answer starts at the oldest line
  // kept.
  optional string after = 3;
  // The matches after `after`, in the order of the log; the matches of one event in the order
  // the rules are shipped.
  repeated RuleMatch matches = 4;
  // The place to pass as `--after` next time, the core's own words: opaque, stored and passed
  // back whole. Absent when the collector is not installed: the next answer starts at the oldest
  // line kept.
  optional string continue_after = 5;
  // Whether whole lines are left after `continue_after` that this answer did not read because
  // it stopped at its limit.
  bool more = 6;
  // What was read after `after` up to `continue_after`, and what was not.
  Stretch stretch = 7;
  Collector collector = 8;
  // The shipped rules that are not evaluated over these events, or only in part, each with why.
  repeated Unevaluated unevaluated = 9;
  // The store this answer was read from, as in every answer (`common.proto`): random, made once
  // when the store was made. Absent for a store an older build made that no command has written
  // to since: until one does, nothing tells it apart from another store.
  optional string store_id = 10;
}

// A published rule matched an event. A match is named by its `position` and its rule's `name`.
message RuleMatch {
  // Where the event's line is: the core's own reference, opaque, that includes the log file's
  // identity, so it is never given to another line. Positions are not ordered as text: matches
  // come in the order of the log.
  string position = 1;
  Rule rule = 2;
  Event event = 3;
  // What became of the match among the core's findings.
  Raised raised = 4;
  // The findings the match was added to, each with its state, when `raised` is `finding`. One
  // today. A finding's state says whether the person has already answered it: a match added to a
  // finding marked `expected`, or to one marked `seen` since, raises nothing the person sees.
  // `immune finding <id>` shows one. After them, the `verdict.suspicious` finding of the latest
  // `suspicious` verdict about the match, whatever `raised` is.
  repeated FindingRef findings = 5;
  // The response layer's verdicts about this match. The `verdict.suspicious` finding a
  // `suspicious` one went to is also among `findings`; `raised` stays what the core did. Absent
  // when there are none.
  Verdicts verdicts = 6;
}

// What became of a match among the core's findings. Values are added within version 1.
// `UNSPECIFIED`, or a value the reader does not know, is read as something it cannot judge: the
// reader judges the match itself.
enum Raised {
  RAISED_UNSPECIFIED = 0;
  // The rule is marked below high: its matches are counted and raise nothing. The reader judges
  // the match itself.
  RAISED_BELOW_HIGH = 1;
  // The core's own reading raised a finding of the match or added it to one, as `findings` says.
  RAISED_FINDING = 2;
  // The core's own reading has not read the line yet. This is not a promise of a finding. When
  // the reading reaches the line, the match raises the rule's finding or adds to it, and a later
  // answer says which. A line deleted before then is never read, and no finding holds it. The
  // reader judges the match itself.
  RAISED_NOT_READ_YET = 3;
  // The core's own reading read the line and no finding holds the match, as a build that lacked
  // the rule leaves it. The reader judges the match itself.
  RAISED_NO_FINDING = 4;
  // The core's own reading read the line before the core kept which finding each match went to.
  // It went to one of the rule's findings on this Mac, and the core cannot tell which. The reader
  // judges the match itself; `immune findings --all` lists the rule's findings.
  RAISED_UNRECORDED = 5;
  // The rule's set states no level (its `level` is `LEVEL_NOT_STATED`): its matches are counted
  // and raise nothing by themselves. The reader judges the match itself.
  RAISED_LEVEL_NOT_STATED = 6;
}

// What was read after `after` up to `continue_after`, and what was not. Adding the stretches of
// answers that follow one another gives what one reading of the whole log gives.
message Stretch {
  // Lines read and evaluated by the rules of their kind.
  uint64 program_starts = 1;
  uint64 file_events = 2;
  // Lines read that hold a kind of message the rules are not asked about.
  uint64 other = 3;
  // Lines that are not a message, such as a line split at the turn of an hour: not evaluated.
  uint64 unreadable_lines = 4;
  // File events the collector or the core could not make out, such as one whose path eslogger
  // marked as cut short: not evaluated.
  uint64 unreadable_file_events = 5;
  // Program starts missing from eslogger's numbering: dropped before they reached the log, or
  // in lines deleted before they were read. The number before this stretch's first program start
  // is the one `after` holds, so a gap at the seam between two answers is counted in the later
  // one; without `after`, the first has nothing before it.
  uint64 program_starts_lost = 6;
  // Times the numbering of program starts started again, as it does when eslogger restarts:
  // each a loss of unknown size.
  uint64 program_starts_unknown_losses = 7;
  // The same for files created and renamed.
  uint64 file_events_lost = 8;
  uint64 file_events_unknown_losses = 9;
  // Lines that `after` had not read were deleted, or their file replaced, before this answer
  // could read them: they are gone, and nothing in them was evaluated here. The core cannot say
  // how many.
  bool gone = 10;
  // When `gone`, where the log kept goes on: the first line of the first file kept at or after
  // the place of the lines that are gone, as a `position`. Absent when no such file is kept.
  optional string kept_from = 11;
}

// The collector and what it records.
message Collector {
  // Its state, judged from its log when this answer was made, the way the core's own reading
  // judges it. This is the state that speaks for the stretch just read. Only while it is
  // `running` does a quiet stretch mean that little happened.
  CollectorState state = 1;
  // What made it `refused` or `failing`: who printed it, `eslogger` or `scripts`, and the last
  // line printed.
  optional string said_by = 2;
  optional string said_text = 3;
  // When its log was last written to, as the files' times say. A time later than `answered_at`
  // is not taken as a sign that it records.
  optional int64 written_at = 4;
  // Whether the collector installed here is established to record files created and renamed.
  // When it is not, or it is not installed, the rules for file events are listed in
  // `unevaluated` with `not_collected`.
  bool file_events_collected = 5;
  // Its state as `immune status` serves it now, from the core's own latest reading, and when
  // that reading was made. It speaks for the core's findings and for `raised`, not for the
  // stretch. Absent when the store holds no reading of it.
  optional CollectorState status_state = 6;
  optional int64 status_read_at = 7;
  // Files in the log folder that are not the collector's own, by their names: not read.
  uint64 foreign_files = 8;
  // What a collector may keep beyond what the first one kept, `identity`, `script` and
  // `signature`, each in one of four lists by what the lines read up to the end of the stretch
  // say of it. Kept is decided by what arrives, never by a record. A rule that reads one that
  // does not arrive is listed in `unevaluated` with `not_collected`, and `detail_text` says which
  // of the first three it is.
  //
  // `not_kept`: the latest line lacks it, so the collector that wrote it is an earlier one, which
  // keeps none of them.
  repeated string not_kept = 9;
  // Lines carry it, and none read has given it a value yet.
  repeated string kept_never_filled = 10;
  // No line that would carry it has been read, as before the first line of a new install, or
  // when an answer read nothing after a place an earlier build printed.
  repeated string not_yet_known = 11;
  // Lines give it a value, each with the time of the first line that did, as the lines' times
  // give it.
  repeated Arriving arriving = 12;
}

// One of what a collector may keep, arriving: lines give it values.
message Arriving {
  // `identity`, `script` or `signature`.
  string name = 1;
  // The time of the first line that gave it a value since lines began to carry it, in seconds
  // since the epoch.
  int64 since = 2;
}

// The collector's states, as `immune status` names them.
enum CollectorState {
  COLLECTOR_STATE_UNSPECIFIED = 0;
  // Its launch daemon is not installed. A limit the user can lift, not a failure.
  COLLECTOR_STATE_NOT_INSTALLED = 1;
  COLLECTOR_STATE_RUNNING = 2;
  // macOS refuses eslogger Full Disk Access.
  COLLECTOR_STATE_REFUSED = 3;
  // Its scripts print errors.
  COLLECTOR_STATE_FAILING = 4;
  // Nothing was written for 15 minutes.
  COLLECTOR_STATE_SILENT = 5;
  // The core's reading failed. Only `status_state` holds this: an answer whose reading fails
  // is not given.
  COLLECTOR_STATE_FAILED = 6;
}

// A shipped rule that is not evaluated over the events here, or only in part, or a rule of a
// translated set that was not taken.
message Unevaluated {
  // Its path in the shipped set; for a rule not taken, the upstream file's path under its
  // repository's `rules/` folder.
  string file = 1;
  // Its name, its set and its id as `Rule.name` gives it: `sigma:<id>`, `elastic:<rule_id>` or
  // `elastic-behaviour:<rule_id>`. Absent for a rule that could not be read.
  optional string name = 2;
  // Its `id`, `title` and level. Absent for a rule that could not be read. `level` is
  // `LEVEL_NOT_STATED` for a rule whose set states none.
  optional string id_text = 3;
  optional string title_text = 4;
  optional Level level = 5;
  UnevaluatedReason reason = 6;
  // The fields it needs that the events here do not give: for `needs_fields`, and for `in_part`
  // those of the alternatives that never match.
  repeated string fields_text = 7;
  // For `needs_events` the kind of event it is about; for `not_parsed` what the parser said; for
  // `not_collected` why the collector here is not taken to record file events, or to keep what
  // the rule reads. For a rule a translated set did not take, what the translation said of it,
  // and for `in_part` what a translation left out that is not a missing field, such as a
  // pattern it could not carry.
  optional string detail_text = 8;
  // Its set, as `Rule.source` and `Rule.set` give it; present for a rule that could not be read
  // too.
  string source = 9;
  string set = 10;
}

// Why a rule judges nothing here, or only part of what it means.
enum UnevaluatedReason {
  UNEVALUATED_REASON_UNSPECIFIED = 0;
  // It is about a kind of event the collector does not record.
  UNEVALUATED_REASON_NEEDS_EVENTS = 1;
  // A selection it cannot do without needs fields the events do not give.
  UNEVALUATED_REASON_NEEDS_FIELDS = 2;
  // It searches whole messages for keywords; the core has fields, not messages.
  UNEVALUATED_REASON_KEYWORD_SEARCH = 3;
  // It could not be read.
  UNEVALUATED_REASON_NOT_PARSED = 4;
  // Evaluated, and some alternatives of its selections never match here.
  UNEVALUATED_REASON_IN_PART = 5;
  // A rule for file events, and the collector here is not installed or not established to
  // record them; or a rule that reads what the collector here does not keep, its fields in
  // `fields_text`.
  UNEVALUATED_REASON_NOT_COLLECTED = 6;
  // The four below are a translation's reasons for not taking a rule of a set translated into
  // Sigma. It correlates several events in a sequence.
  UNEVALUATED_REASON_SEQUENCE = 7;
  // It is written in a query language other than EQL, the one translated.
  UNEVALUATED_REASON_NOT_EQL = 8;
  // A part it cannot do without holds a backslash in a wildcard pattern, whose meaning in
  // Elasticsearch is not documented.
  UNEVALUATED_REASON_BACKSLASH_IN_WILDCARD = 9;
  // It is about program starts and file events at once.
  UNEVALUATED_REASON_SPANS_KINDS = 10;
  // The four below are also a translation's reasons for not taking a rule. It could never be
  // true over the events here, such as one that asks for a field no event of its kind has.
  UNEVALUATED_REASON_NEVER_TRUE = 11;
  // A part it cannot do without is a regular expression in EQL's syntax, which is not
  // translated.
  UNEVALUATED_REASON_REGEX = 12;
  // A part it cannot do without uses a function of EQL's that is not translated.
  UNEVALUATED_REASON_UNSUPPORTED = 13;
  // A part it cannot do without compares one field of the event with another, which a Sigma
  // rule cannot.
  UNEVALUATED_REASON_FUNCTION = 14;
}
