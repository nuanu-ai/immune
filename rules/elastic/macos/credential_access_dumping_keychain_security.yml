title: "Dumping of Keychain Content via Security Command"
id: "565d6ca5-75ba-4c82-9b13-add25353471c"
status: "test"
description: "Adversaries may dump the content of the keychain storage data from a system to acquire credentials. Keychains are the\nbuilt-in way for macOS to keep track of users' passwords and credentials for many services and features, including Wi-Fi\nand website passwords, secure notes, certificates, and Kerberos."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/macos/credential_access_dumping_keychain_security.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2021-01-04"
modified: "2026-09-18"
tags: ["attack.t1555.001"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.args|contains": ["\u0000dump-keychain\u0000"]}
  s2: {"process.args|contains|cased": ["\u0000-d\u0000"]}
  condition: "(s1 and s2)"
level: "high"
elastic: {"rule_id": "565d6ca5-75ba-4c82-9b13-add25353471c", "severity": "high", "risk_score": 73, "query_sha256": "0778b22b872da56d4bc94002985e9f936d43f34f73286335b9b3671fbf64aef8", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": ["process_started"], "null_sensitive": [], "folded_fields": []}
