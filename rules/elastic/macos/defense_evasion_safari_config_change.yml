title: "Modification of Safari Settings via Defaults Command"
id: "6482255d-f468-45ea-a5b3-d3a7de1331ae"
status: "test"
description: "Identifies changes to the Safari configuration using the built-in defaults command. Adversaries may attempt to enable or\ndisable certain Safari settings, such as enabling JavaScript from Apple Events to ease in the hijacking of the users\nbrowser."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/macos/defense_evasion_safari_config_change.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2021-01-14"
modified: "2026-09-18"
tags: ["attack.t1562.001", "attack.t1647"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["defaults"]}
  s2: {"process.args|contains": ["\u0000write\u0000"]}
  s3: {"process.command_line": ["*com.apple.Safari*"]}
  s4: {"process.command_line": ["*IncludeDevelopMenu*", "*JavaScript*"]}
  condition: "(s1 and s2 and s3 and s4)"
level: "medium"
elastic: {"rule_id": "6482255d-f468-45ea-a5b3-d3a7de1331ae", "severity": "medium", "risk_score": 47, "query_sha256": "5ba9e47e2fc0e9275334b9e4ac55d8605d8e368f0ac1b124fa04576440992ca8", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": ["process_started"], "null_sensitive": [], "folded_fields": []}
