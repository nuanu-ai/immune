title: "WebProxy Settings Modification"
id: "10a500bb-a28f-418e-ba29-ca4c8d1a9f2f"
status: "test"
description: "Identifies the use of the built-in networksetup command to configure webproxy settings. This may indicate an attempt to\nhijack web browser traffic for credential access via traffic sniffing or redirection."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/macos/credential_access_mitm_localhost_webproxy.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2021-01-05"
modified: "2026-09-18"
tags: ["attack.t1539", "attack.t1557"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["networksetup"]}
  s2: {"process.args|contains": ["\u0000-setwebproxy\u0000", "\u0000-setsecurewebproxy\u0000", "\u0000-setautoproxyurl\u0000"]}
  s3: {"process.parent.name": ["osascript", "bash", "sh", "zsh", "Terminal", "Python*"]}
  condition: "(s1 and s2 and s3)"
level: "medium"
elastic: {"rule_id": "10a500bb-a28f-418e-ba29-ca4c8d1a9f2f", "severity": "medium", "risk_score": 47, "query_sha256": "46f8d2e2782792def5ff8b5eacd8e5fadad1d0567cc905139a5dfb8c449785dc", "kinds": ["start"], "in_part_missing_fields": ["needs_fields process.parent.code_signature.exists", "needs_fields process.parent.code_signature.trusted"], "also_asks_events": ["process_started"], "null_sensitive": [], "folded_fields": []}
falsepositives: ["Legitimate WebProxy Settings Modification"]
