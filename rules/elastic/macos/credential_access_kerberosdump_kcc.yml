title: "Kerberos Cached Credentials Dumping"
id: "ad88231f-e2ab-491c-8fc6-64746da26cfe"
status: "test"
description: "Identifies the use of the Kerberos credential cache (kcc) utility to dump locally cached Kerberos tickets. Adversaries\nmay attempt to dump credential material in the form of tickets that can be leveraged for lateral movement."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/macos/credential_access_kerberosdump_kcc.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2020-08-14"
modified: "2026-09-18"
tags: ["attack.t1003", "attack.t1558.003", "attack.t1558.005"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["kcc"]}
  s2: {"process.args|contains": ["\u0000copy_cred_cache\u0000"]}
  condition: "(s1 and s2)"
level: "high"
elastic: {"rule_id": "ad88231f-e2ab-491c-8fc6-64746da26cfe", "severity": "high", "risk_score": 73, "query_sha256": "4c410cdaab0eaa33aa97a9793d6ac89213e73c119544291781a191fa57e95992", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": ["process_started"], "null_sensitive": [], "folded_fields": []}
