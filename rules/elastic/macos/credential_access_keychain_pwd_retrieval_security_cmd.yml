title: "Keychain Password Retrieval via Command Line"
id: "9092cd6c-650f-4fa3-8a8a-28256c7489c9"
status: "test"
description: "Adversaries may collect keychain storage data from a system to in order to acquire credentials. Keychains are the\nbuilt-in way for macOS to keep track of users' passwords and credentials for many services and features, including Wi-Fi\nand website passwords, secure notes, certificates, and Kerberos."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/macos/credential_access_keychain_pwd_retrieval_security_cmd.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2020-01-06"
modified: "2026-09-18"
tags: ["attack.t1555.001", "attack.t1555.003"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["security"]}
  s2: {"process.args|contains|cased": ["\u0000-wa\u0000", "\u0000-ga\u0000"]}
  s3: {"process.args|contains": ["\u0000find-generic-password\u0000", "\u0000find-internet-password\u0000"]}
  s4: {"process.command_line": ["*Chrome*", "*Chromium*", "*Opera*", "*Safari*", "*Brave*", "*Microsoft Edge*", "*Firefox*"]}
  s5: {"process.parent.executable|cased": ["/Applications/Keeper Password Manager.app/Contents/Frameworks/Keeper Password Manager Helper*/Contents/MacOS/Keeper Password Manager Helper*"]}
  s6: {"process.parent.executable|exists": true}
  condition: "(s1 and s2 and s3 and s4 and (s6 and not s5))"
level: "high"
elastic: {"rule_id": "9092cd6c-650f-4fa3-8a8a-28256c7489c9", "severity": "high", "risk_score": 73, "query_sha256": "f0aeaaf5831f0bb29e322cd4517e11812015967ea006240eed95f83496280967", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": ["process.parent.executable"], "folded_fields": []}
falsepositives: ["Applications for password management."]
