title: "Potential Hidden Local User Account Creation"
id: "41b638a1-8ab6-4f8e-86d9-466317ef2db5"
status: "test"
description: "Identifies attempts to create a local account that will be hidden from the macOS logon window. This may indicate an\nattempt to evade user attention while maintaining persistence using a separate local account."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/macos/persistence_account_creation_hide_at_logon.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2020-01-05"
modified: "2026-09-18"
tags: ["attack.t1078.003", "attack.t1136.001", "attack.t1564.002"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["dscl"]}
  s2: {"process.args|contains": ["\u0000IsHidden\u0000"]}
  s3: {"process.args|contains": ["\u0000create\u0000"]}
  s4: {"process.args|contains": ["\u0000true\u0000", "\u00001\u0000", "\u0000yes\u0000"]}
  condition: "(s1 and s2 and s3 and s4)"
level: "medium"
elastic: {"rule_id": "41b638a1-8ab6-4f8e-86d9-466317ef2db5", "severity": "medium", "risk_score": 47, "query_sha256": "3f4788f5f221b16e1496191c7d6b1697388cd260f3cb2eb5ec1e7995903be692", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": ["process_started"], "null_sensitive": [], "folded_fields": []}
