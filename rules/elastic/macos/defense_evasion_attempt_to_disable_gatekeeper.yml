title: "Attempt to Disable Gatekeeper"
id: "4da13d6e-904f-4636-81d8-6ab14b4e6ae9"
status: "test"
description: "Detects attempts to disable Gatekeeper on macOS. Gatekeeper is a security feature that's designed to ensure that only\ntrusted software is run. Adversaries may attempt to disable Gatekeeper before executing malicious code."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/macos/defense_evasion_attempt_to_disable_gatekeeper.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2021-01-11"
modified: "2026-09-18"
tags: ["attack.t1553.001"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["spctl"]}
  s2: {"process.args|contains": ["\u0000--master-disable\u0000"]}
  condition: "(s1 and s2)"
level: "medium"
elastic: {"rule_id": "4da13d6e-904f-4636-81d8-6ab14b4e6ae9", "severity": "medium", "risk_score": 47, "query_sha256": "b5562de9da4043373935036d907a2b03147ed45cfe039c80a3eedfd8e355f5db", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": ["process_started"], "null_sensitive": [], "folded_fields": []}
