title: "Persistence via Folder Action Script"
id: "c292fa52-4115-408a-b897-e14f684b3cb7"
status: "test"
description: "Detects modification of a Folder Action script. A Folder Action script is executed when the folder to which it is\nattached has items added or removed, or when its window is opened, closed, moved, or resized. Adversaries may abuse this\nfeature to establish persistence by utilizing a malicious script."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/macos/persistence_folder_action_scripts_runtime.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2020-12-07"
modified: "2026-09-18"
tags: ["attack.t1037", "attack.t1059", "attack.t1546"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.parent.name|cased": ["com.apple.foundation.UserScriptService"]}
  s2: {"process.name": ["osascript", "python*", "tcl*", "node", "perl", "ruby", "php"]}
  s3: {"process.name|cased": ["bash", "csh", "zsh", "sh"]}
  s4: {"process.args|contains|cased": ["\u0000-c\u0000"]}
  s5: [{"process.args|contains|cased": ["\u0000/Library/Scripts/"]}, {"process.args|re": ["(?s)\\x00/Users/[^\\x00]*/Library/Scripts/[^\\x00]*\\x00", "(?s)\\x00/Users/[^\\x00]*/Library/Application Scripts/[^\\x00]*\\x00"]}]
  s6: {"process.args|exists": true}
  condition: "(s1 and (s2 or (s3 and s4)) and (s6 and not s5))"
level: "medium"
elastic: {"rule_id": "c292fa52-4115-408a-b897-e14f684b3cb7", "severity": "medium", "risk_score": 47, "query_sha256": "1108cc77f8dc6e2fc1673c3bfc18d17d978713a05d080a08a552c22b3e52a1f0", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": ["process_started"], "null_sensitive": ["process.args"], "folded_fields": []}
