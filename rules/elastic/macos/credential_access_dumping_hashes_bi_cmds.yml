title: "Dumping Account Hashes via Built-In Commands"
id: "02ea4563-ec10-4974-b7de-12e65aa4f9b3"
status: "test"
description: "Identifies the execution of macOS built-in commands used to dump user account hashes. Adversaries may attempt to dump\ncredentials to obtain account login information in the form of a hash. These hashes can be cracked or leveraged for\nlateral movement."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/macos/credential_access_dumping_hashes_bi_cmds.toml"]
author: "Elastic, Massimo Bertocchi"
license: "Elastic License v2"
date: "2021-01-25"
modified: "2026-09-18"
tags: ["attack.t1003.008"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["defaults"]}
  s2: {"process.args|contains": ["\u0000ShadowHashData\u0000"]}
  s3: {"process.name|cased": ["mkpassdb"]}
  s4: {"process.args|contains|cased": ["\u0000-dump\u0000"]}
  s5: {"process.name|cased": ["dscl"]}
  s6: {"process.name|cased": ["plutil", "cat", "strings", "xxd", "head"]}
  s7: {"process.args|re": ["(?s)\\x00/var/db/dslocal/nodes/Default/users/[^\\x00]*\\.plist\\x00"]}
  condition: "((s1 and s2) or (s3 and s4) or (s5 and s2) or (s6 and s7))"
level: "high"
elastic: {"rule_id": "02ea4563-ec10-4974-b7de-12e65aa4f9b3", "severity": "high", "risk_score": 73, "query_sha256": "0aa5d384e2a5f79522dc35b85695f6868d6e2ee70278537f5a6748f76b2414a5", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": ["process_started"], "null_sensitive": [], "folded_fields": []}
