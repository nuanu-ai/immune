title: "Kubectl Secrets Enumeration Across All Namespaces"
id: "a87d49f0-24ae-4d6e-a0b4-5fd2f6188d6a"
status: "test"
description: "This rule detects the use of the \"kubectl get secrets --all-namespaces\" command, which enumerates secret resources\nacross the entire Kubernetes cluster. Attackers may use this command to identify accessible secrets in multiple\nnamespaces, aiding credential discovery, privilege escalation, or lateral movement."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/cross-platform/discovery_kubectl_secrets_all_namespaces.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2026-03-26"
modified: "2026-11-03"
tags: ["attack.t1552", "attack.t1613"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["kubectl"]}
  s2: {"process.args|contains|cased": ["\u0000get\u0000", "\u0000describe\u0000"]}
  s3: {"process.args|contains|cased": ["\u0000secret\u0000", "\u0000secrets\u0000"]}
  s4: {"process.args|contains|cased": ["\u0000--all-namespaces\u0000", "\u0000-A\u0000"]}
  condition: "(s1 and s2 and s3 and s4)"
level: "high"
elastic: {"rule_id": "a87d49f0-24ae-4d6e-a0b4-5fd2f6188d6a", "severity": "high", "risk_score": 73, "query_sha256": "a6a45ea7f045b7e4444c762a990b19ffc5e29a86511b73590a96fc561037f3a1", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": ["ProcessRollup2", "exec_event", "executed", "process_started"], "null_sensitive": [], "folded_fields": []}
