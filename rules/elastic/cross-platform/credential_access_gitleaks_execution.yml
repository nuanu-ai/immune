title: "Potential Secret Scanning via Gitleaks"
id: "f92171ed-a4d3-4baa-98f9-4df1652cb11b"
status: "test"
description: "This rule detects the execution of Gitleaks, a tool used to search for high-entropy strings and secrets in code\nrepositories, which may indicate an attempt to access credentials."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/cross-platform/credential_access_gitleaks_execution.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2025-11-28"
modified: "2026-09-18"
tags: ["attack.t1003", "attack.t1213.003", "attack.t1552.001", "attack.t1555"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name": ["gitleaks.exe", "gitleaks"]}
  condition: "s1"
level: "medium"
elastic: {"rule_id": "f92171ed-a4d3-4baa-98f9-4df1652cb11b", "severity": "medium", "risk_score": 47, "query_sha256": "cc03b30d25dc7f1e935b4e221bf9540c562b580e288778e1253f254ea928a8c9", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": ["Process Create*", "ProcessRollup2", "exec_event", "executed", "process_started"], "null_sensitive": [], "folded_fields": []}
falsepositives: ["    Gitleaks is a legitimate open-source tool used by security professionals and developers to search for sensitive\n    information, such as passwords, API keys, and other secrets, within code repositories. It is commonly employed\n    during security assessments and code reviews to identify potential vulnerabilities.\n    "]
