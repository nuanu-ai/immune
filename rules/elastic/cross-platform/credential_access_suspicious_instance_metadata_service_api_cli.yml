title: "Suspicious Instance Metadata Service (IMDS) API Command Line Execution"
id: "ecc0cd54-608e-11ef-ab6d-f661ea17fbce"
status: "test"
description: "This rule identifies various tools/scripts performing command line execution attempting to access the cloud service\nprovider's instance metadata service (IMDS) API endpoint, which can be used to retrieve sensitive instance-specific\ninformation such as instance ID, public IP address, and even temporary security credentials if roles are assumed by\nthat instance."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/cross-platform/credential_access_suspicious_instance_metadata_service_api_cli.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2024-08-22"
modified: "2026-09-18"
tags: ["attack.t1016", "attack.t1082", "attack.t1552.005", "attack.t1580"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name": ["curl", "curl.exe", "wget", "wget.exe", "bash", "dash", "sh", "tcsh", "tclsh", "wish", "csh", "zsh", "ksh", "fish", "mksh", "busybox", "powershell.exe", "cmd.exe", "pwsh.exe", "pwsh"]}
  s2: {"process.name": [".*", "python*", "perl*", "ruby*", "php*", "lua*", "java*"]}
  s3: {"process.executable": ["/tmp/*", "/var/tmp/*", "/dev/shm/*", "/home/*/*", "/var/run/*", "/run/*", "/boot/*", "/.*", "/var/www/*", "./*"]}
  s4: {"immune.folded.process.args|re": ["(?s)\\x00[^\\x00]*/latest/meta\\-data/iam/security\\-credentials/[^\\x00][^\\x00]*\\x00", "(?s)\\x00[^\\x00]*computemetadata/v1/instance/service\\-accounts/[^\\x00]*/oauth2/access_token[^\\x00]*\\x00", "(?s)\\x00[^\\x00]*/metadata/identity/oauth2/token[^\\x00]*resource=[^\\x00]*\\x00"]}
  condition: "((s1 or s2 or s3) and s4)"
level: "medium"
elastic: {"rule_id": "ecc0cd54-608e-11ef-ab6d-f661ea17fbce", "severity": "medium", "risk_score": 47, "query_sha256": "706301ee19c85a4a62221cf86707fd1b72e37c9f3adfc40c208013c6d8c023c4", "kinds": ["start"], "in_part_missing_fields": ["backslash_in_wildcard process.executable: ?:\\ProgramData\\*", "backslash_in_wildcard process.executable: C:\\Users\\*"], "also_asks_events": ["Process Create*", "ProcessRollup2", "exec_event", "executed", "process_started"], "null_sensitive": [], "folded_fields": ["process.args"]}
