title: "Credential Access via TruffleHog Execution"
id: "47595dea-452b-4d37-b82d-6dd691325139"
status: "test"
description: "This rule detects the execution of TruffleHog, a tool used to search for high-entropy strings and secrets\nin code repositories, which may indicate an attempt to access credentials. This tool was abused by the Shai-Hulud\nworm to search for credentials in code repositories."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/cross-platform/credential_access_trufflehog_execution.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2025-09-18"
modified: "2026-09-18"
tags: ["attack.t1003", "attack.t1005", "attack.t1552.001", "attack.t1555"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name": ["trufflehog.exe", "trufflehog"]}
  s2: {"process.args|contains|cased": ["\u0000--json\u0000"]}
  s3: {"process.args|contains|cased": ["\u0000filesystem\u0000"]}
  condition: "(s1 and s2 and s3)"
level: "medium"
elastic: {"rule_id": "47595dea-452b-4d37-b82d-6dd691325139", "severity": "medium", "risk_score": 47, "query_sha256": "ce49da47dddafb97ecb319eda2280525a6d96315bd0f72b677bcf4b0ca754719", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": []}
falsepositives: ["    Trufflehog is a legitimate open-source tool used by security professionals and developers to search for sensitive\n    information, such as passwords, API keys, and other secrets, within code repositories. It is commonly employed\n    during security assessments and code reviews to identify potential vulnerabilities.\n    "]
