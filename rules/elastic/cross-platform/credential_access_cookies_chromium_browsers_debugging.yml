title: "Potential Cookies Theft via Browser Debugging"
id: "027ff9ea-85e7-42e3-99d2-bbb7069e02eb"
status: "test"
description: "Identifies the execution of a Chromium based browser with the debugging process argument, which may indicate an attempt\nto steal authentication cookies. An adversary may steal web application or service session cookies and use them to gain\naccess web applications or Internet services as an authenticated user without needing credentials."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/cross-platform/credential_access_cookies_chromium_browsers_debugging.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2020-12-21"
modified: "2026-09-18"
tags: ["attack.t1539"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["Microsoft Edge", "chrome.exe", "Google Chrome", "google-chrome-stable", "google-chrome-beta", "google-chrome", "msedge.exe"]}
  s2: {"process.args|contains": ["\u0000--remote-debugging-port=", "\u0000--remote-debugging-targets=", "\u0000--remote-debugging-pipe="]}
  s3: {"process.args|contains": ["\u0000--user-data-dir="]}
  s4: {"process.args|contains": ["\u0000--remote-debugging-port=0\u0000"]}
  s5: {"process.args|exists": true}
  condition: "(s1 and s2 and s3 and (s5 and not s4))"
level: "medium"
elastic: {"rule_id": "027ff9ea-85e7-42e3-99d2-bbb7069e02eb", "severity": "medium", "risk_score": 47, "query_sha256": "1525cef333bd2ae90e036b4b25a4067ad28b2f7db423036f29082daafcc343fc", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": ["info", "process_started"], "null_sensitive": ["process.args"], "folded_fields": []}
falsepositives: ["Developers performing browsers plugin or extension debugging."]
