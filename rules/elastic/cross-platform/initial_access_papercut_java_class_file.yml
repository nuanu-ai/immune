title: "Suspicious Java Class File Created in PaperCut Server Library"
id: "a2d4508e-e9c2-41f6-9466-0c3aed8cc2c9"
status: "test"
description: "Detects creation of Java .class files within the PaperCut NG/MF Application Server library directory. During active\nexploitation of CVE-2026-82078 (chained with CVE-2026-81578), attackers deliver hex-encoded malicious .class payloads\ninto the PaperCut server/lib path (observed examples include Udydn.class and Moo97.class) so arbitrary bytecode executes\ninside the PaperCut JVM / Application Server process."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/cross-platform/initial_access_papercut_java_class_file.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2026-08-28"
modified: "2026-09-18"
tags: ["attack.t1059", "attack.t1190", "attack.t1620"]
logsource: {"product": "macos", "category": "file_event"}
detection:
  s1: {"event.action|cased": ["creation", "overwrite"]}
  s2: {"file.extension": ["class"]}
  s3: {"file.path": ["/opt/papercut/server/lib/*", "/usr/local/papercut/server/lib/*", "/Applications/PaperCut*/server/lib/*"]}
  condition: "(s1 and s2 and s3)"
level: "critical"
elastic: {"rule_id": "a2d4508e-e9c2-41f6-9466-0c3aed8cc2c9", "severity": "critical", "risk_score": 99, "query_sha256": "4bb065bcbb27ee4a9eb88970a3bb82d0440b2244f4f5e91697fbd6618a8d58f6", "kinds": ["create"], "in_part_missing_fields": ["backslash_in_wildcard file.path: ?:\\Program Files (x86)\\PaperCut*\\server\\lib\\*", "backslash_in_wildcard file.path: ?:\\Program Files\\PaperCut*\\server\\lib\\*"], "also_asks_events": ["overwrite"], "null_sensitive": [], "folded_fields": []}
