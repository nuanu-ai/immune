title: "User Keychain Exfiltration via Curl"
id: "de452505-4d5a-4d44-90ff-56b4912a20f3"
status: "test"
description: "Detects when curl or nscurl is executed with the user's keychain database file path in the command line, indicating\npotential exfiltration of sensitive credentials. This technique is commonly observed in npm typosquatting attacks and\nmacOS stealers where malicious packages use curl to upload the keychain database to attacker-controlled servers. The\nmacOS keychain contains highly sensitive credential data including passwords, certificates, and encryption keys that\nadversaries seek to exfiltrate for further compromise."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/exfiltration_user_keychain_exfiltration_via_curl.toml"]
license: "Elastic License v2"
tags: ["attack.t1048", "attack.t1555.001"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["curl", "nscurl"]}
  s2: {"process.command_line": ["*/Users/*/Library/Keychains/login.keychain-db*"]}
  condition: "(s1 and s2)"
elastic: {"rule_id": "de452505-4d5a-4d44-90ff-56b4912a20f3", "severity": null, "risk_score": null, "query_sha256": "9e8a54ca57175e90a9699f944fce3f6fb003c06481f85c4e45fa5920917531a3", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.1", "actions_ignored": ["kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
