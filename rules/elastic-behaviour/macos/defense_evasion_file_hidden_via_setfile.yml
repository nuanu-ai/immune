title: "File Hidden via SetFile"
id: "2ed9c6bf-025e-4edf-a9ec-1493d0bb4f81"
status: "test"
description: "Detects when SetFile is used to modify the file attributes of a file in order to make that file invisible. Malware on\nmacOS has been observed using this technique in order to hide their payload from users."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/defense_evasion_file_hidden_via_setfile.toml"]
license: "Elastic License v2"
tags: ["attack.t1564.001"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["SetFile"]}
  s2: {"process.args|contains|cased": ["\u0000-a\u0000"]}
  s3: {"process.args|contains|cased": ["\u0000V\u0000"]}
  condition: "(s1 and s2 and s3)"
elastic: {"rule_id": "2ed9c6bf-025e-4edf-a9ec-1493d0bb4f81", "severity": null, "risk_score": null, "query_sha256": "3bf9eb485ba35591e4c7eb627a4a61099b49d7aa360b5c5b259bf1219eb72a02", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.3", "actions_ignored": ["kill_process process.entity_id", "kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
