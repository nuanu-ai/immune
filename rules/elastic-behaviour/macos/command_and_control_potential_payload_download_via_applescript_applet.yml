title: "Potential Payload Download via AppleScript Applet"
id: "52ad2198-1a7b-4492-b578-6ffa110f9b09"
status: "test"
description: "Identifies activity where an AppleScript applet is executed followed by the immediate execution of the \"curl\" command.\nAn attacker might use an AppleScript applet to automate malicious tasks and leverage \"curl\" to download additional\npayloads or communicate with a command and control (C2) server. This activity has been observed being utilized by XCSSET\nand more recently by a new threat deemed \"Rustbucket\" by JAMF to bypass Gatekeeper and download a second stage payload."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/command_and_control_potential_payload_download_via_applescript_applet.toml"]
license: "Elastic License v2"
tags: ["attack.t1105", "attack.t1553.001"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["curl", "nscurl"]}
  s2: {"process.parent.name|cased": ["applet"]}
  s3: {"process.args|contains|cased": ["\u0000POST\u0000"]}
  s4: {"process.args|exists": true}
  condition: "(s1 and s2 and (s4 and not s3))"
elastic: {"rule_id": "52ad2198-1a7b-4492-b578-6ffa110f9b09", "severity": null, "risk_score": null, "query_sha256": "dbc9925f283e1494a304422bfc474db57ab8ca92159c66089d2d61932ae8cabc", "kinds": ["start"], "in_part_missing_fields": ["needs_fields process.Ext.effective_parent.name"], "also_asks_events": [], "null_sensitive": ["process.args"], "folded_fields": [], "version": "1.0.19", "actions_ignored": ["kill_process process.entity_id", "kill_process process.parent.entity_id"], "elastic_also_evaluates_on": ["fork"]}
