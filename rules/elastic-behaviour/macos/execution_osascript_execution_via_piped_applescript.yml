title: "Osascript Execution via Piped AppleScript"
id: "e955b5d2-2396-4af2-9540-680aa390c547"
status: "test"
description: "Detects when AppleScript is directly piped to the Osascript binary for execution. Threat actors utilize this method in\norder to avoid traditional Osascript detections and perform various tasks on the system."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/execution_osascript_execution_via_piped_applescript.toml"]
license: "Elastic License v2"
tags: ["attack.t1059.002"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["sh", "bash", "zsh", "dash", "csh", "tcsh", "ksh", "tclsh", "fish"]}
  s2: {"process.name|cased": ["tclsh*"]}
  s3: {"process.args|contains|cased": ["\u0000-c\u0000"]}
  s4: {"process.command_line": ["*osascript*<<EOD*"]}
  condition: "((s1 or s2) and s3 and s4)"
elastic: {"rule_id": "e955b5d2-2396-4af2-9540-680aa390c547", "severity": null, "risk_score": null, "query_sha256": "2e6aba0692fd92aeedebb6ceb0fdb2e4cb115d1ee937be7276292479ef767214", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.5", "actions_ignored": ["kill_process process.entity_id", "kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
