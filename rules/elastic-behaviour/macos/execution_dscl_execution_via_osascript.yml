title: "Dscl Execution via Osascript"
id: "7a7b94ce-be0f-4e2b-8af8-606199b5256e"
status: "test"
description: "Detects the execution of the Dscl binary via Osascript in order to collect user information. The AMOS malware utilizes\nthis technique in its AppleScripts in order to determine the current user."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/execution_dscl_execution_via_osascript.toml"]
license: "Elastic License v2"
tags: ["attack.t1033", "attack.t1059.002"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["dscl"]}
  s2: {"process.parent.name|cased": ["osascript"]}
  condition: "(s1 and s2)"
