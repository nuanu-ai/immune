title: "Web Browsers Password Access via Command Line"
id: "77d71ede-3025-4c71-bb99-ada7c344bf89"
status: "test"
description: "Adversaries may collect keychain storage data from a system to in order to acquire credentials. Keychains are the\nbuilt-in way for macOS to keep track of users' passwords and credentials for many services and features, including Wi-Fi\nand website passwords, secure notes, certificates, and Kerberos."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/credential_access_web_browsers_password_access_via_command_line.toml"]
license: "Elastic License v2"
tags: ["attack.t1555.003"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["security"]}
  s2: {"process.args|contains|cased": ["\u0000-wa\u0000", "\u0000-ga\u0000"]}
  s3: {"process.args|contains": ["\u0000find-generic-password\u0000", "\u0000find-internet-password\u0000"]}
  s4: {"process.command_line": ["*Chrome*", "*Chromium*", "*Opera*", "*Safari*", "*Brave*", "*Microsoft Edge*", "*Firefox*"]}
  s5: {"process.parent.executable": ["/Applications/Keeper Password Manager.app/Contents/Frameworks/Keeper Password Manager Helper*/Contents/MacOS/Keeper Password Manager Helper*"]}
  s6: {"process.parent.executable|exists": true}
  condition: "(s1 and s2 and s3 and s4 and (s6 and not s5))"
elastic: {"rule_id": "77d71ede-3025-4c71-bb99-ada7c344bf89", "severity": null, "risk_score": null, "query_sha256": "88507a0a2658501ec2b43f1b8820f0bed544372c158974731316a8d2ce7520ab", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": ["process.parent.executable"], "folded_fields": [], "version": "1.0.29", "actions_ignored": ["kill_process process.entity_id"], "elastic_also_evaluates_on": []}
