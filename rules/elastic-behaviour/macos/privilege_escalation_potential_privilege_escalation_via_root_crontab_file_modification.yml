title: "Potential Privilege Escalation via Root Crontab File Modification"
id: "31151602-1de1-4301-9b75-215ac8902b75"
status: "test"
description: "Identifies modifications to the root crontab file. Adversaries may overwrite this file to gain code execution with root\nprivileges by exploiting privileged file write or move related vulnerabilities."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/privilege_escalation_potential_privilege_escalation_via_root_crontab_file_modification.toml"]
license: "Elastic License v2"
tags: ["attack.t1053.003"]
logsource: {"product": "macos", "category": "file_event"}
detection:
  s1: {"event.type|cased": ["deletion"]}
  s2: {"file.path|cased": ["/private/var/at/tabs/root"]}
  s3: {"process.executable|cased": ["/usr/bin/crontab"]}
  condition: "(not s1 and s2 and not s3)"
