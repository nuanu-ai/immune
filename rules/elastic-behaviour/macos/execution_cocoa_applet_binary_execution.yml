title: "Cocoa Applet Binary Execution"
id: "7f1ac069-ff3b-498e-8e2e-535cc89ba583"
status: "test"
description: "Detects the execution of a Cocoa framework Applet binary. MacOS applications can be developed using Cocoa, which is a\nset of frameworks providing a foundation for building graphical, event-driven applications on macOS. The use of this\ntype of Mach-O is extremely rare to see, especially within an application and should be considered suspicious. Threat\nactors have utilized this method of binary creation due to being able to locally build and sign their payloads."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/execution_cocoa_applet_binary_execution.toml"]
license: "Elastic License v2"
tags: ["attack.t1059.002"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["cocoaapplet"]}
  s2: {"process.parent.name|cased": ["cocoaapplet"]}
  condition: "(s1 or s2)"
