title: "Suspicious TruffleHog Execution via NodeJS"
id: "0f46cf1b-2c9f-4d56-8073-08b41bac72b4"
status: "test"
description: "This rule detects the execution of TruffleHog from a JavaScript interpreter, TruffleHog is a tool used to search for\nhigh-entropy strings and secrets in code repositories, which may indicate an attempt to access credentials. This tool\nwas abused by the Shai-Hulud worm to search for credentials in code repositories."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/credential_access_suspicious_trufflehog_execution_via_nodejs.toml"]
license: "Elastic License v2"
tags: ["attack.t1059.007", "attack.t1195.001", "attack.t1555"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["trufflehog", "trufflehog.exe"]}
  s2: {"process.args|contains|cased": ["\u0000filesystem\u0000"]}
  s3: {"process.args|contains|cased": ["\u0000--json\u0000"]}
  s4: {"process.parent.name|cased": ["node.exe", "node", "bun", "bun.exe"]}
  s5: {"process.working_directory|cased": ["*node_modules*"]}
  condition: "(((s1 and s2) or (s3 and s2)) and (s4 or s5))"
elastic: {"rule_id": "0f46cf1b-2c9f-4d56-8073-08b41bac72b4", "severity": null, "risk_score": null, "query_sha256": "db49e160c4d085c815f5716fac48d3b0e4cd94e5732925e6a76ff80b15a50e27", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.1", "actions_ignored": ["kill_process process.entity_id"], "elastic_also_evaluates_on": []}
