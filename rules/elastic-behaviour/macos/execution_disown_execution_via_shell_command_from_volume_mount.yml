title: "Disown Execution via Shell Command from Volume Mount"
id: "511bd55d-f845-45da-8b35-7dd9a40fa7b2"
status: "test"
description: "Detects when disown is executed by a shell command with the responsible process having been executed from a volume\nmount. The use of the disown binary on macOS is in itself an anomaly and something that almost never occurs but when\npaired with being executed via a shell command from a volume mounted binary indicates malicious activity. Disown\noriginates from unix and allows one to remove any and all jobs from the current shell. A threat actor may do this in\norder to ensure there are no current jobs executing or that may execute that could prevent their actions from completing\nor cause them to be noticed."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/execution_disown_execution_via_shell_command_from_volume_mount.toml"]
license: "Elastic License v2"
tags: ["attack.t1059.004"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.args|contains|cased": ["\u0000bash\u0000", "\u0000sh\u0000", "\u0000zsh\u0000"]}
  s2: {"process.args|contains|cased": ["\u0000-c\u0000"]}
  s3: {"process.args|contains": ["disown"]}
  s4: {"process.parent.executable|cased": ["/Volumes/*"]}
  condition: "(s1 and s2 and s3 and s4)"
elastic: {"rule_id": "511bd55d-f845-45da-8b35-7dd9a40fa7b2", "severity": null, "risk_score": null, "query_sha256": "2609cc22a97bcf058652ba2b1f04f036f60b99630af499d3d6c091abe715669a", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.3", "actions_ignored": ["kill_process process.entity_id", "kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
