title: "Potential Access to Kerberos Cached Credentials"
id: "dc8fa849-efb4-45d1-be1a-9472325ff746"
status: "test"
description: "Identifies the use of the Kerberos credential cache (kcc) utility to dump locally cached Kerberos tickets. Adversaries\nmay attempt to dump credentials to obtain account login information in the form of a ticket. These tickets can be\nleveraged for lateral movement."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/credential_access_potential_access_to_kerberos_cached_credentials.toml"]
license: "Elastic License v2"
tags: ["attack.t1558.005"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["kcc"]}
  s2: {"process.command_line": ["*copy_cred_cache*"]}
  condition: "(s1 and s2)"
elastic: {"rule_id": "dc8fa849-efb4-45d1-be1a-9472325ff746", "severity": null, "risk_score": null, "query_sha256": "7b0cd3180635bdac56e3d7e09ab2e77cf860eb5fef05d92f217578b4a98f7d75", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.30", "actions_ignored": ["kill_process process.entity_id"], "elastic_also_evaluates_on": []}
