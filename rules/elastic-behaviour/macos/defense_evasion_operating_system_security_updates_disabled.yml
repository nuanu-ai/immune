title: "Operating System Security Updates Disabled"
id: "741ad90d-e8d0-4d29-b91b-3d68108cb789"
status: "test"
description: "Identifies changes to the SoftwareUpdate preferences using the built-in defaults command. Adversaries may abuse this in\nan attempt to disable security updates."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/defense_evasion_operating_system_security_updates_disabled.toml"]
license: "Elastic License v2"
tags: ["attack.t1562.001"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["defaults"]}
  s2: {"process.args|contains": ["\u0000write\u0000"]}
  s3: {"process.args|contains": ["\u0000-bool\u0000"]}
  s4: {"process.command_line": ["*com.apple.SoftwareUpdate*"]}
  s5: {"process.args|contains": ["\u0000CriticalUpdateInstall\u0000"]}
  s6: {"process.args|contains": ["\u0000NO\u0000"]}
  condition: "(s1 and s2 and s3 and s4 and s5 and s6)"
