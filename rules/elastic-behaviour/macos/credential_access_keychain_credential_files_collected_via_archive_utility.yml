title: "Keychain Credential Files Collected via Archive Utility"
id: "150f20b4-6b21-460b-8ae4-339695c1c86c"
status: "test"
description: "Adversaries may collect the keychain storage data from a system to acquire credentials. Keychains are the built-in way\nfor macOS to keep track of users' passwords and credentials for many services and features such as WiFi passwords,\nwebsites, secure notes and certificates."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/credential_access_keychain_credential_files_collected_via_archive_utility.toml"]
license: "Elastic License v2"
tags: ["attack.t1555.001"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["zip", "tar"]}
  s2: {"process.command_line": ["*/Users/*/Library/Keychains/*", "*/Library/Keychains/*", "*/Network/Library/Keychains/*", "*System.keychain*", "*login.keychain-db*", "*login.keychain*"]}
  s3: [{"process.args|contains": ["\u0000find-certificate\u0000", "\u0000add-trusted-cert\u0000", "\u0000set-keychain-settings\u0000", "\u0000delete-certificate\u0000", "\u0000show-keychain-info\u0000", "\u0000lock-keychain\u0000", "\u0000set-key-partition-list\u0000", "\u0000import\u0000", "\u0000find-identity\u0000"]}, {"immune.folded.process.args|re": ["(?s)\\x00/users/[^\\x00]*/library/keychains/openvpn\\.keychain\\-db\\x00"]}]
  s4: {"process.args|exists": true}
  s5: {"process.parent.executable|cased": ["/Applications/OpenVPN Connect/OpenVPN Connect.app/Contents/MacOS/OpenVPN Connect", "/Applications/Microsoft Defender.app/Contents/MacOS/wdavdaemon_enterprise.app/Contents/MacOS/wdavdaemon_enterprise", "/opt/jc/bin/jumpcloud-agent"]}
  s6: {"process.parent.executable|exists": true}
  s7: {"process.executable|cased": ["/opt/jc/bin/jumpcloud-agent"]}
  condition: "(s1 and s2 and (s4 and not s3) and (s6 and not s5) and not s7)"
elastic: {"rule_id": "150f20b4-6b21-460b-8ae4-339695c1c86c", "severity": null, "risk_score": null, "query_sha256": "218e7a3edae416ea5f9aaa90b0d138c61ff7fc6457ac1e857e0e97811534a02b", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": ["process.args", "process.parent.executable"], "folded_fields": ["process.args"], "version": "1.0.31", "actions_ignored": ["kill_process process.entity_id", "kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
