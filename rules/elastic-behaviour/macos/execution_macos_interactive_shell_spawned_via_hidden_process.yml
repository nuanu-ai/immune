title: "MacOS Interactive Shell Spawned via Hidden Process"
id: "8d6b1c6b-fd51-4a56-bc34-ea91f9921651"
status: "test"
description: "Detects when a hidden process spawns an interactive shell. Many different types of malware will create and execute\nhidden binaries in order to avoid suspicion or detection by a user. Sometimes depending on the implementation a payload\nwill open an interactive shell on the target system in order to execute post exploitation commands in real time."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/execution_macos_interactive_shell_spawned_via_hidden_process.toml"]
license: "Elastic License v2"
tags: ["attack.t1059.004"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["bash", "sh", "zsh", "dash", "csh", "tcsh", "ksh", "tclsh", "fish"]}
  s2: {"process.name|cased": ["tclsh*"]}
  s3: {"process.args|contains|cased": ["\u0000-i\u0000"]}
  s4: {"process.args_count": 2}
  s5: {"process.parent.name": [".*"]}
  condition: "((s1 or s2) and s3 and s4 and s5)"
elastic: {"rule_id": "8d6b1c6b-fd51-4a56-bc34-ea91f9921651", "severity": null, "risk_score": null, "query_sha256": "a94e94872d4c12a4339e0870db957486d8cf8208691b981fed942c85504e785f", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.5", "actions_ignored": ["kill_process process.entity_id", "kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
