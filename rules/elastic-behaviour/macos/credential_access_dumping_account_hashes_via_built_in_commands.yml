title: "Dumping Account Hashes via Built-In Commands"
id: "2ed766db-e0b0-4a07-8ec1-4e41dd406b64"
status: "test"
description: "Identifies the execution of macOS built-in commands used to dump user account hashes. Adversaries may attempt to dump\ncredentials to obtain account login information in the form of a hash. These hashes can be cracked or leveraged for\nlateral movement."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/credential_access_dumping_account_hashes_via_built_in_commands.toml"]
license: "Elastic License v2"
tags: ["attack.t1003"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["defaults", "mkpassdb"]}
  s2: {"process.args|contains": ["\u0000ShadowHashData\u0000", "\u0000-dump\u0000"]}
  condition: "(s1 and s2)"
elastic: {"rule_id": "2ed766db-e0b0-4a07-8ec1-4e41dd406b64", "severity": null, "risk_score": null, "query_sha256": "c9775fca0d7b20113ed74b6ae013e46d663f47f7782c3d5416d9fe310b63c82e", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.30", "actions_ignored": ["kill_process process.entity_id"], "elastic_also_evaluates_on": ["fork"]}
