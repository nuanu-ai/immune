title: "Potential Kerberos Attack via Bifrost"
id: "fecebe4f-2d28-46e7-9bc1-71cdd8ecdd60"
status: "test"
description: "Identifies use of Bifrost, a known macOS Kerberos pentesting tool, which can be used to dump cached Kerberos tickets or\nattempt unauthorized authentication techniques such as pass-the-ticket/hash and kerberoasting."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/lateral_movement_potential_kerberos_attack_via_bifrost.toml"]
license: "Elastic License v2"
tags: ["attack.t1550.003", "attack.t1558.003"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.args|contains": ["\u0000-action\u0000"]}
  s2: {"process.args|contains": ["\u0000-kerberoast\u0000", "\u0000askhash\u0000", "\u0000asktgs\u0000", "\u0000asktgt\u0000", "\u0000s4u\u0000"]}
  s3: {"process.args|contains": ["\u0000-ticket\u0000"]}
  s4: {"process.args|contains": ["\u0000ptt\u0000"]}
  s5: {"process.args|contains": ["\u0000dump\u0000"]}
  s6: {"process.args|contains": ["\u0000tickets\u0000", "\u0000keytab\u0000"]}
  condition: "(s1 and (s2 or (s3 and s4) or (s5 and s6)))"
elastic: {"rule_id": "fecebe4f-2d28-46e7-9bc1-71cdd8ecdd60", "severity": null, "risk_score": null, "query_sha256": "0bb51425f2e5e360d6beffad27ebe3db58f4bc73d083fa055e1e13c643892c72", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.28", "actions_ignored": ["kill_process process.entity_id"], "elastic_also_evaluates_on": ["fork"]}
