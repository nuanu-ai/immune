title: "Potential Credential Harvesting via Python"
id: "d2f85eb5-4ea2-484e-82a1-98399a532f97"
status: "test"
description: "Identifies Python interpreters started with -c (inline code) where the command line suggests looking up credentials from\na browser's password store."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/credential_access_potential_credential_harvesting_via_python.toml"]
license: "Elastic License v2"
tags: ["attack.t1059.006", "attack.t1555"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name": ["python*", "py.exe", "py", "pypy*"]}
  s2: {"process.args|contains|cased": ["\u0000-c\u0000"]}
  s3: {"process.command_line": ["*Secret.password_lookup_sync*"]}
  s4: {"process.command_line": ["*microsoft-edge*", "*brave*", "*chromium*", "*chrome*", "*vivaldi*", "*opera*"]}
  condition: "(s1 and s2 and s3 and s4)"
elastic: {"rule_id": "d2f85eb5-4ea2-484e-82a1-98399a532f97", "severity": null, "risk_score": null, "query_sha256": "4972f4ef9eedea6de300b320b8978c4155f69bc69c478b22bb83d0893020726d", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.1", "actions_ignored": ["kill_process process.entity_id", "kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
