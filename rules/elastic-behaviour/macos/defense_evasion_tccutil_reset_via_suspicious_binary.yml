title: "Tccutil Reset via Suspicious Binary"
id: "addfc3f1-4b1c-4005-9133-f64de1aabe6e"
status: "test"
description: "Detects when Tccutils is used to reset the TCC database decisions for a specific service via a suspicious binary."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/defense_evasion_tccutil_reset_via_suspicious_binary.toml"]
license: "Elastic License v2"
tags: ["attack.t1548.006"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["tccutil"]}
  s2: {"process.args|contains": ["\u0000reset\u0000"]}
  s3: {"process.parent.name|cased": ["osascript"]}
  condition: "(s1 and s2 and s3)"
elastic: {"rule_id": "addfc3f1-4b1c-4005-9133-f64de1aabe6e", "severity": null, "risk_score": null, "query_sha256": "807e47d1153a2d56a213bc1220cfe440e7ecf0c07bcf4ae28ba97cde67d7b05a", "kinds": ["start"], "in_part_missing_fields": ["needs_fields process.parent.code_signature.exists", "needs_fields process.parent.code_signature.trusted"], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.4", "actions_ignored": ["kill_process process.entity_id", "kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
