title: "Suspicious Elevated Command Execution"
id: "2f7b4008-99c6-46e9-9d93-97a4b801ac91"
status: "test"
description: "Detects potential malicious elevated command executions on macOS by monitoring processes spawned by authtrampoline,\nwhich handles macOS privilege escalation. It flags processes with untrusted or missing code signatures, commonly abused\nprocess names like osascript, curl, and dscl, as well as shell executions with suspicious arguments. The aim is to\nswiftly identify and respond to abnormal elevated activities on a macOS system."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/execution_suspicious_elevated_command_execution.toml"]
license: "Elastic License v2"
tags: ["attack.t1059.004"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.parent.name|cased": ["authtrampoline"]}
  s2: {"process.name": ["osascript", "curl", "nscurl", "dscl", ".*"]}
  s3: {"process.name|cased": ["sh", "bash", "zsh"]}
  s4: {"process.args|contains|cased": ["\u0000-c\u0000"]}
  s5: {"process.args|contains": ["\u0000dscl", "\u0000curl", "\u0000nscurl", "\u0000osascript", "\u0000/tmp/", "\u0000/private/tmp/", "\u0000/var/tmp/"]}
  condition: "(s1 and (s2 or (s3 and s4 and s5)))"
elastic: {"rule_id": "2f7b4008-99c6-46e9-9d93-97a4b801ac91", "severity": null, "risk_score": null, "query_sha256": "2578c7998ed34f3ce06fa8733884d2bd7db4b072afac0d557fb7f7608cb23027", "kinds": ["start"], "in_part_missing_fields": ["needs_fields process.code_signature.exists", "needs_fields process.code_signature.trusted"], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.8", "actions_ignored": ["kill_process process.entity_id"], "elastic_also_evaluates_on": []}
