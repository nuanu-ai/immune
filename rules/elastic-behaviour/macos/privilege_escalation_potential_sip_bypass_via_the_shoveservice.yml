title: "Potential SIP Bypass via the ShoveService"
id: "7dea8cfc-92db-4081-9a5d-85ead8cedd5f"
status: "test"
description: "Identifies the use of the Shove service to modify a SIP protected resource. A malicious application may be able to\nmodify protected parts of the file system by spawning the shov process with the -X|x options (used to communicate with\nthe system XPC service and removed by Apple in recent versions)."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/privilege_escalation_potential_sip_bypass_via_the_shoveservice.toml"]
license: "Elastic License v2"
tags: ["attack.t1068"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["shove"]}
  s2: {"process.args|contains|cased": ["\u0000-x\u0000"]}
  condition: "(s1 and s2)"
elastic: {"rule_id": "7dea8cfc-92db-4081-9a5d-85ead8cedd5f", "severity": null, "risk_score": null, "query_sha256": "9a7fdb8c5295f1a15e33ace7ca7736ff167461683337bec475fda66e2353d193", "kinds": ["start"], "in_part_missing_fields": ["needs_fields process.code_signature.signing_id"], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.23", "actions_ignored": ["kill_process process.entity_id"], "elastic_also_evaluates_on": []}
