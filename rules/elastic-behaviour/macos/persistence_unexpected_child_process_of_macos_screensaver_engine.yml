title: "Unexpected Child Process of macOS Screensaver Engine"
id: "fba012f6-7aa8-448e-8f59-cdecce2845b5"
status: "test"
description: "Identifies when a child process is spawned by the screensaver engine process, which is consistent with an attacker's\nmalicious payload being executed after the screensaver activated on the endpoint. An adversary can maintain persistence\non a macOS endpoint by creating a malicious screensaver (.saver) file and configuring the screensaver plist file to\nexecute code each time the screensaver is activated."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/persistence_unexpected_child_process_of_macos_screensaver_engine.toml"]
license: "Elastic License v2"
tags: ["attack.t1546.002"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.parent.name|cased": ["ScreenSaverEngine"]}
  condition: "s1"
