title: "User Keychain copied via Shell interpreter"
id: "8b0e22e0-dfee-46fa-8695-be94334d34f1"
status: "test"
description: "Detects when the copy command is used to copy the user keychain database via a shell interpreter. Some recent malware\nstealer samples have been seen using this technique to retrieve sensitive files prior to exfiltration. The copying of\nthe user keychain database is not normal activity under almost any circumstance and should be considered highly\nsuspicious if not malicious."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/credential_access_user_keychain_copied_via_shell_interpreter.toml"]
license: "Elastic License v2"
tags: ["attack.t1555.001"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["cp"]}
  s2: {"process.command_line": ["*/Users/*/Library/Keychains/login.keychain-db*"]}
  s3: {"process.parent.name": ["bash", "zsh", "sh", "Terminal"]}
  condition: "(s1 and s2 and s3)"
elastic: {"rule_id": "8b0e22e0-dfee-46fa-8695-be94334d34f1", "severity": null, "risk_score": null, "query_sha256": "b9abe6cd9698b95705f172acbd622bc48e4bf44f69f76eb2c7c204e27037370c", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.3", "actions_ignored": ["kill_process process.entity_id", "kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
