title: "Suspicious Apple Script Execution"
id: "7b9d544a-5b2a-4f0d-984a-cdc89a7fad25"
status: "test"
description: "Identifies the execution of the Apple script interpreter (osascript) process with suspicious command line arguments.\nThis behavior is consistent with an attacker executing malicious scripts for execution or command and control."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/execution_suspicious_apple_script_execution.toml"]
license: "Elastic License v2"
tags: ["attack.t1059", "attack.t1105"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["osascript"]}
  s2: {"process.args|contains": ["\u0000JavaScript\u0000"]}
  s3: {"process.command_line": ["*eval(*"]}
  s4: {"process.command_line": ["*initWithDataEncoding*", "*dataWithContentsOfURL*", "*URLWithString*", "*http*"]}
  condition: "(s1 and s2 and s3 and s4)"
elastic: {"rule_id": "7b9d544a-5b2a-4f0d-984a-cdc89a7fad25", "severity": null, "risk_score": null, "query_sha256": "4ff455df0f9a49e0d24f73d09c2b0fd2b8e96138d5e66552d403b92ebb64b4c9", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.31", "actions_ignored": ["kill_process process.entity_id"], "elastic_also_evaluates_on": []}
