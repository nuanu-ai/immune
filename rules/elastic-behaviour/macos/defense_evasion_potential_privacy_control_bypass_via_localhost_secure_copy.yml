title: "Potential Privacy Control Bypass via Localhost Secure Copy"
id: "55df8e91-fd3c-4cc1-b36f-f01ded8c6da3"
status: "test"
description: "Identifies use of the Secure Copy Protocol (SCP) to copy files locally by abusing the auto addition of the Secure Shell\nDaemon (sshd) to the authorized application list for Full Disk Access. This may indicate attempts to bypass macOS\nprivacy controls to access sensitive files."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/defense_evasion_potential_privacy_control_bypass_via_localhost_secure_copy.toml"]
license: "Elastic License v2"
tags: ["attack.t1548.006"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["scp"]}
  s2: {"process.args|contains": ["\u0000StrictHostKeyChecking=no\u0000"]}
  s3: [{"process.command_line": ["*scp *localhost:/*"]}, {"immune.folded.process.command_line|re": ["(?s)\\A.*scp .*127\\.0\\.0\\..:/.*\\z"]}]
  s4: {"process.command_line": ["*vagrant@*127.0.0.1*"]}
  condition: "(s1 and s2 and s3 and not s4)"
elastic: {"rule_id": "55df8e91-fd3c-4cc1-b36f-f01ded8c6da3", "severity": null, "risk_score": null, "query_sha256": "ac3150d8821c4b79450f2a02b9d9cd656a1de22c0e08888d970bb43ab5dbeed3", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": ["process.command_line"], "version": "1.0.30", "actions_ignored": ["kill_process process.entity_id"], "elastic_also_evaluates_on": ["fork"]}
