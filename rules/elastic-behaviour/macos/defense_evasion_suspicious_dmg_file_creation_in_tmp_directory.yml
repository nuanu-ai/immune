title: "Suspicious DMG File Creation in Tmp Directory"
id: "fdb0e7ed-4210-4b71-be47-d0b0d9458fa7"
status: "test"
description: "Detects the creation of a DMG file in the temp directory. The creation of a DMG file like this has been observed being\nused to exploit vulnerabilities that allow for mounting over sensitive parts of the filesystem, thereby bypassing\ncertain macOS security controls such as TCC and SIP. This activity is not normal or common and should be considered\nsuspicious."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/defense_evasion_suspicious_dmg_file_creation_in_tmp_directory.toml"]
license: "Elastic License v2"
tags: ["attack.t1059.004", "attack.t1211"]
logsource: {"product": "macos", "category": "file_event"}
detection:
  s1: {"event.action|cased": ["modification", "rename"]}
  s2: {"process.name|cased": ["diskimages-helper"]}
  s3: {"file.extension|cased": ["dmg"]}
  s4: {"file.path|cased": ["/private/tmp/*", "/tmp/*"]}
  s5: {"file.path": ["/private/tmp/munki-*/*.dmg", "/private/tmp/Ventura.dmg", "/private/tmp/Sonoma.dmg", "/private/tmp/com.ninxsoft.mist/*"]}
  condition: "(s1 and s2 and s3 and s4 and not s5)"
elastic: {"rule_id": "fdb0e7ed-4210-4b71-be47-d0b0d9458fa7", "severity": null, "risk_score": null, "query_sha256": "34329a57c47e1f45ecff02bbdd5207098a1ed9c6a746d2f325fa941ffaba5c4d", "kinds": ["rename"], "in_part_missing_fields": [], "also_asks_events": ["modification"], "null_sensitive": [], "folded_fields": [], "version": "1.0.21", "actions_ignored": ["kill_process process.entity_id"], "elastic_also_evaluates_on": ["modification"]}
