title: "User Keychain copied via Script Interpreter"
id: "1bd903b1-b40b-4cb0-8c84-f982fc044c11"
status: "test"
description: "Detects when Osascript spawns the cp binary to copy the user's Keychain file. Threat actors execute scripts that copies\nsensitive files to staging locations before exfiltration. This activity is highly suspicious and indicative of\ncredential theft attempts."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/credential_access_user_keychain_copied_via_script_interpreter.toml"]
license: "Elastic License v2"
tags: ["attack.t1555.001"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["cp"]}
  s2: {"process.parent.name|cased": ["osascript", "node"]}
  s3: {"process.command_line": ["*keychain*"]}
  condition: "(s1 and s2 and s3)"
elastic: {"rule_id": "1bd903b1-b40b-4cb0-8c84-f982fc044c11", "severity": null, "risk_score": null, "query_sha256": "96659885a79cd35dd9d8f08a55e70b5ffe65ba1634d98d42af476a52245829d7", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.1", "actions_ignored": ["kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
