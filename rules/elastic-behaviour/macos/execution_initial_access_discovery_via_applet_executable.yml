tags: ["attack.t1033", "attack.t1059.004"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.parent.name|cased": ["applet"]}
  s2: {"process.name|cased": ["whoami", "sw_vers", "arch", "uname"]}
  condition: "(s1 and s2)"
