title: "Initial Access Discovery via Applet Executable"
id: "d169079a-3495-40ce-9fde-387852b201de"
status: "test"
description: "Detects the execution of a system or user discovery command via a compiled Apple script binary Applet."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/execution_initial_access_discovery_via_applet_executable.toml"]
