title: "User Keychain Copied via Suspicious Parent"
id: "2f6d797d-b14a-4f9f-8914-b5b29a0103e2"
status: "test"
description: "Detects when the copy command is used to copy the user keychain database and the parent process is executing from a\nsuspicious or temporary directory. Threat actors often deploy malware to staging locations such as /tmp,\n/Library/Caches, or /Users/Shared and then use native macOS utilities to collect sensitive credential files like the\nkeychain database prior to exfiltration. This rule complements shell-interpreter-based detections by covering cases\nwhere malware directly spawns the copy utility without an intermediary shell process."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/credential_access_user_keychain_copied_via_suspicious_parent.toml"]
license: "Elastic License v2"
tags: ["attack.t1555.001"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["cp"]}
  s2: {"process.command_line": ["*login.keychain-db*"]}
  s3: {"process.parent.executable|cased": ["/tmp/*", "/private/tmp/*", "/var/tmp/*", "/private/var/tmp/*", "/Users/Shared/*", "/Library/Caches/*", "/Users/*/Library/Caches/*", "/private/var/folders/*", "/var/folders/*"]}
  condition: "(s1 and s2 and s3)"
elastic: {"rule_id": "2f6d797d-b14a-4f9f-8914-b5b29a0103e2", "severity": null, "risk_score": null, "query_sha256": "88bb24fc27bbc7f10c3a3d44d1177f617bd4f456fdbd74e45e6c21601b61e122", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.1", "actions_ignored": ["kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
