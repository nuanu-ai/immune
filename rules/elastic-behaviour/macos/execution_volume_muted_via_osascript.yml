title: "Volume Muted via Osascript"
id: "6948957d-2988-47a7-b7d8-2dec8bfe172b"
status: "test"
description: "Detects the use of Osascript to mute the system volume. A new stealer named 'Banshee' was seen doing this in order to\nprevent security notifications from possibly being noticed."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/execution_volume_muted_via_osascript.toml"]
license: "Elastic License v2"
tags: ["attack.t1059.002"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["osascript"]}
  s2: {"process.args|contains|cased": ["\u0000-e\u0000"]}
  s3: {"process.command_line": ["*set volume with output muted*"]}
  condition: "(s1 and s2 and s3)"
elastic: {"rule_id": "6948957d-2988-47a7-b7d8-2dec8bfe172b", "severity": null, "risk_score": null, "query_sha256": "8edd8656a0f0fd6fede85de6ef040d5e64ec27364854df7c15929fe515606251", "kinds": ["start"], "in_part_missing_fields": [], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.4", "actions_ignored": ["kill_process process.entity_id", "kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
