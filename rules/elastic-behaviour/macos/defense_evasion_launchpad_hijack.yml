title: "Launchpad Hijack"
id: "b64bf1de-5e36-4051-89d6-8b4492bcfdbd"
status: "test"
description: "This rule detects when the open command is used to launch the Launchpad application and the parent process is a\nscripting language or the parent process is not signed or does not have a code signature. Threat actors have been seen\nusing the open command to launch the Launchpad application from a scripting language or from an unsigned or untrusted\nprocess to evade detection when attempting to implement a malicious launchpad application."
references: ["https://github.com/elastic/protections-artifacts/blob/a87715d87a2babd51b37ff6c55f104fe7e567911/behavior/rules/macos/defense_evasion_launchpad_hijack.toml"]
license: "Elastic License v2"
tags: ["attack.t1574"]
logsource: {"product": "macos", "category": "process_creation"}
detection:
  s1: {"process.name|cased": ["open"]}
  s2: {"process.args|contains|cased": ["\u0000com.apple.launchpad.launcher\u0000"]}
  s3: {"process.parent.name|cased": ["osascript", "applet", "bash", "sh", "zsh"]}
  condition: "(s1 and s2 and s3)"
elastic: {"rule_id": "b64bf1de-5e36-4051-89d6-8b4492bcfdbd", "severity": null, "risk_score": null, "query_sha256": "5a8aa799a3202a57d249b6d636f2baf707df5cf5564c037538e28a186109d75c", "kinds": ["start"], "in_part_missing_fields": ["needs_fields process.parent.code_signature.exists", "needs_fields process.parent.code_signature.trusted"], "also_asks_events": [], "null_sensitive": [], "folded_fields": [], "version": "1.0.3", "actions_ignored": ["kill_process process.parent.entity_id"], "elastic_also_evaluates_on": []}
